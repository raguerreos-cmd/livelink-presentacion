<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveLink — Propuesta Campaña de Reconocimiento</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#120a3a;--navy2:#0d0728;--navy3:#090520;
  --orange:#f05a00;
  --font:'Outfit',sans-serif;
  --ease:cubic-bezier(0.76,0,0.24,1);
  --sidebar:64px;
  --col-closed:160px;
  --dur:.7s;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--navy);color:#fff;font-family:var(--font);cursor:none;}

/* CURSOR */
#cur{position:fixed;z-index:9999;width:10px;height:10px;background:#fff;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);}
#cur2{position:fixed;z-index:9998;width:34px;height:34px;border:1.5px solid rgba(240,90,0,0.5);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);}

/* SHELL */
#shell{position:fixed;inset:0;display:flex;}

/* SIDEBAR */
#sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--navy2);
  border-right:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;align-items:center;
  padding:20px 0;z-index:20;
}
#logo-mark{
  width:44px;height:44px;background:var(--orange);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:22px;color:#fff;
  user-select:none;cursor:pointer;
  transition:transform .2s var(--ease),opacity .2s;
}
#logo-mark:hover{transform:scale(1.08);opacity:.9;}

/* MAIN */
#main{flex:1;display:flex;position:relative;overflow:hidden;}

/* STAGE HOME */
#stage-home{
  position:relative;overflow:hidden;
  flex:1;
  transition:flex var(--dur) var(--ease), opacity var(--dur) var(--ease);
  z-index:1;
}
#main.panel-open #stage-home{flex:0;opacity:0;pointer-events:none;}

/* DOTS */
.dots-bg{position:absolute;inset:0;pointer-events:none;z-index:0;}
.dot{position:absolute;border-radius:50%;opacity:0;transform:scale(0.4);transition:opacity .7s var(--ease),transform .7s var(--ease);}
.dot.show{opacity:1;transform:scale(1);}
.dot-o{background:var(--orange);}
.dot-d{background:rgba(155,50,8,0.5);}

/* HOME CONTENT */
#home-content{
  position:absolute;inset:0;z-index:1;
  display:flex;flex-direction:column;justify-content:center;
  padding:0 72px;padding-bottom:14vh;
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
}
#main.panel-open #home-content{opacity:0;transform:translateX(-30px);}
.home-logo{font-size:clamp(80px,10vw,118px);font-weight:800;line-height:1;letter-spacing:-3px;margin-bottom:26px;user-select:none;}
.home-logo .live{color:#fff;font-weight:300;}
.home-logo .link{color:var(--orange);font-weight:800;}
.home-rule{width:min(540px,75%);height:1px;background:rgba(255,255,255,0.22);margin-bottom:22px;}
.home-sub{font-size:clamp(18px,2.2vw,28px);font-weight:200;color:rgba(255,255,255,0.85);letter-spacing:0.01em;line-height:1.3;}

/* ══════════════════════════════════════════
   COLUMNAS NAV
   Cada columna tiene:
   - ancho cerrado: 88px
   - ancho abierto: todo el espacio disponible
   - número + etiqueta SIEMPRE visibles, alineados a la izquierda
   ══════════════════════════════════════════ */
.nav-col{
  position:relative;
  flex-shrink:0;
  width:var(--col-closed);
  box-shadow:inset 4px 0 18px rgba(0,0,0,0.45);
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  overflow:hidden;
  transition:width var(--dur) var(--ease), background .3s, flex var(--dur) var(--ease);
  z-index:5;
}
.nav-col:hover:not(.active){background:rgba(255,255,255,0.02);}

/* Columna ACTIVA se expande, toma todo el flex restante */
.nav-col.active{
  width:auto;
  flex:1;
  background:var(--navy);
  cursor:default;
}

/* Número — centrado en reposo, izquierda al expandir */
.nav-num-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 0 0 0;
  flex-shrink:0;
  width:100%;
  transition:justify-content var(--dur) var(--ease), padding var(--dur) var(--ease);
}
.nav-col.active .nav-num-wrap{
  justify-content:flex-start;
  padding:24px 0 0 48px;
}
.nav-num-inner{
  width:44px;height:44px;
  border-radius:50%;
  border:2.5px solid var(--orange);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;color:#fff;
  background:transparent;
  transition:background .3s;
  flex-shrink:0;
}
.nav-col.active    .nav-num-inner{background:rgba(240,90,0,0.15);}
.nav-col:hover:not(.active) .nav-num-inner{background:rgba(240,90,0,0.1);}

/* Etiqueta — centrada en reposo, izquierda al expandir */
.nav-label{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%) rotate(180deg);
  writing-mode:vertical-rl;
  font-size:24px;font-weight:700;letter-spacing:.04em;
  color:rgba(255,255,255,0.45);
  white-space:nowrap;user-select:none;
  transition:color .3s, left var(--dur) var(--ease), transform var(--dur) var(--ease);
  pointer-events:none;
}
.nav-col.active .nav-label{
  left:48px;
  transform:translateX(0) rotate(180deg);
}
.nav-col:hover:not(.active) .nav-label{color:rgba(255,255,255,0.8);}
.nav-col.active .nav-label{color:rgba(255,255,255,0.6);}

/* CONTENIDO de la columna activa */
.col-content{
  position:absolute;
  inset:0;
  padding:80px 0 0 0;
  opacity:0;
  pointer-events:none;
  transform:translateX(40px);
  transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  overflow-y:auto;
  overflow-x:hidden;
  display:flex;flex-direction:column;
  scrollbar-width:thin;
  scrollbar-color:rgba(240,90,0,0.3) transparent;
}
.nav-col.active .col-content{
  opacity:1;
  pointer-events:all;
  transform:translateX(0);
  transition-delay:.2s;
}

/* AVATAR D-ID — ocupa todo el col-content sin padding */
#content-4, #content-2, #content-3{
  padding:0 !important;
  overflow:hidden;
}
#did-host{
  position:absolute;
  top:0;
  bottom:0;
  left:80px;
  right:0;
  background:var(--navy);
}
/* Forzar que el widget D-ID llene todo */
#did-host > *,
#did-agent{
  width:100% !important;
  height:100% !important;
  border:none !important;
  border-radius:0 !important;
  min-height:unset !important;
}


/* ── MERCADEO CONTENT STYLES ── */
.mc-scroll{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:0 80px 80px 80px;
  scrollbar-width:thin;
  scrollbar-color:rgba(240,90,0,0.3) transparent;
}
.mc-scroll::-webkit-scrollbar{width:4px;}
.mc-scroll::-webkit-scrollbar-thumb{background:rgba(240,90,0,0.3);border-radius:4px;}

/* Sección intro — logo + texto */
.mc-intro{
  display:flex;
  align-items:center;
  gap:48px;
  padding:60px 0 60px 0;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.mc-intro-logo{
  display:flex;align-items:center;gap:0;
  font-size:36px;font-weight:800;white-space:nowrap;flex-shrink:0;
}
.mc-intro-logo .live{color:#fff;font-weight:300;}
.mc-intro-logo .link-pill{
  background:var(--orange);border-radius:50px;
  padding:2px 18px;color:#fff;font-weight:800;
  font-size:36px;margin-left:4px;
}
.mc-intro-divider{width:1px;height:80px;background:rgba(255,255,255,0.25);flex-shrink:0;}
.mc-intro-text{font-size:15px;line-height:1.7;color:rgba(255,255,255,0.85);max-width:440px;}

/* Sección target */
.mc-target{
  display:flex;align-items:center;gap:40px;
  padding:60px 0;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.mc-icon-circle{
  width:110px;height:110px;border-radius:50%;
  background:var(--orange);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-size:48px;
}
.mc-target-text{font-size:15px;line-height:1.75;color:rgba(255,255,255,0.82);max-width:520px;}

/* Secciones con card */
.mc-section{padding:60px 0;border-bottom:1px solid rgba(255,255,255,0.08);}
.mc-section:last-child{border-bottom:none;}

.mc-section-title{
  font-size:clamp(22px,2.5vw,30px);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:8px;
  line-height:1.2;
}
.mc-section-title .hl{
  background:var(--orange);
  color:#fff;
  padding:2px 10px;
  border-radius:4px;
  margin:0 4px;
}
.mc-title-rule{width:180px;height:1px;background:rgba(255,255,255,0.25);margin-bottom:40px;}

.mc-card{
  background:rgba(255,255,255,0.05);
  border-radius:16px;
  padding:36px;
  display:flex;
  gap:36px;
  align-items:center;
  position:relative;
  overflow:visible;
}
.mc-card-icon{
  width:100px;height:100px;border-radius:50%;
  border:2.5px solid var(--orange);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-size:36px;
}
.mc-card-body{flex:1;}

.mc-label-tag{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:4px;
}
.mc-label-tag::after{
  content:'';display:inline-block;
  width:40px;height:1.5px;background:rgba(255,255,255,0.4);
  vertical-align:middle;
}
.mc-label-tag .dot-tag{
  width:8px;height:8px;border-radius:50%;background:var(--orange);
  display:inline-block;margin-left:4px;
}
.mc-label-big{
  font-size:clamp(22px,2.2vw,28px);
  font-weight:800;text-transform:uppercase;
  letter-spacing:.02em;margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.mc-label-big::after{
  content:'';display:inline-block;
  width:3px;height:28px;background:var(--orange);
  border-radius:2px;
}
.mc-card-desc{font-size:14px;line-height:1.75;color:rgba(255,255,255,0.75);}
.mc-card-desc strong{color:#fff;font-weight:600;}

.mc-dot-orange{
  width:60px;height:60px;border-radius:50%;background:var(--orange);
  position:absolute;
}

/* Key Visual */
.mc-keyvisual{
  display:flex;gap:36px;align-items:center;
  background:rgba(255,255,255,0.05);
  border-radius:16px;
  padding:36px;
  position:relative;
  overflow:hidden;
}
.mc-kv-img{
  width:200px;flex-shrink:0;
  font-size:80px;text-align:center;
  position:relative;z-index:1;
}
.mc-kv-body{flex:1;z-index:1;}
.mc-kv-body .kv-tag{font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,0.5);text-transform:uppercase;margin-bottom:4px;}
.mc-kv-body .kv-title{font-size:clamp(36px,4vw,52px);font-weight:800;line-height:1;margin-bottom:8px;}
.mc-kv-body .kv-sub{font-size:18px;font-weight:700;line-height:1.3;text-transform:uppercase;}
.mc-kv-body .kv-sub .hl{background:var(--orange);padding:2px 8px;border-radius:4px;}

/* Canal */
.mc-canal-card{
  background:rgba(255,255,255,0.05);
  border-radius:16px;
  padding:36px 48px;
  text-align:center;
  position:relative;
}
.mc-canal-name{
  font-size:clamp(40px,5vw,64px);font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:20px 0 24px;
}
.mc-canal-in{
  background:#0A66C2;border-radius:12px;
  padding:4px 14px;color:#fff;font-size:clamp(40px,5vw,64px);font-weight:700;
}
.mc-canal-desc{font-size:13px;line-height:1.75;color:rgba(255,255,255,0.7);max-width:560px;margin:0 auto;}

/* Hook */
.mc-hook{display:flex;gap:40px;align-items:flex-start;}
.mc-hook-card{
  flex:1;border:1.5px solid rgba(255,255,255,0.15);border-radius:16px;
  padding:28px;
  font-size:13px;color:rgba(255,255,255,0.8);line-height:1.7;
}
.mc-hook-card .hk-brand{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.mc-hook-card .hk-brand .pill{background:var(--orange);border-radius:20px;padding:2px 12px;font-size:14px;}
.mc-hook-card .hk-title{font-size:18px;font-weight:800;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.mc-hook-card .hk-title .bracket{color:rgba(255,255,255,0.4);font-weight:300;}
.mc-hook-copy{flex:1;}
.mc-hook-copy h4{font-size:14px;font-weight:600;margin-bottom:12px;color:rgba(255,255,255,0.6);}
.mc-hook-copy hr{border:none;border-top:1px solid rgba(255,255,255,0.1);margin-bottom:16px;}
.mc-hook-copy p{font-size:13px;line-height:1.8;color:rgba(255,255,255,0.75);margin-bottom:12px;}

/* Núcleo solución */
.mc-nucleo{display:flex;gap:24px;align-items:flex-start;margin-top:8px;}
.mc-nucleo-item{flex:1;text-align:center;}
.mc-nucleo-icon{
  width:90px;height:90px;border-radius:50%;
  border:2.5px solid var(--orange);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;font-size:32px;
}
.mc-nucleo-connector{
  flex:0 0 40px;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:rgba(255,255,255,0.3);
  padding-top:45px;
}
.mc-nucleo-name{font-size:14px;font-weight:700;margin-bottom:8px;}
.mc-nucleo-desc{font-size:12px;line-height:1.7;color:rgba(255,255,255,0.6);text-align:center;}

/* KPIs */
.mc-kpi-intro{font-size:13px;line-height:1.8;color:rgba(255,255,255,0.7);margin-bottom:32px;max-width:700px;}
.mc-kpi-card{
  background:rgba(255,255,255,0.05);border-radius:16px;
  padding:28px 32px;margin-bottom:28px;
  position:relative;
}
.mc-kpi-num{
  width:44px;height:44px;border-radius:50%;
  background:var(--orange);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;
  position:absolute;top:-16px;left:32px;
}
.mc-kpi-title{font-size:15px;font-weight:700;margin-bottom:20px;padding-top:12px;}
.mc-kpi-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;}
.mc-kpi-icon{font-size:22px;flex-shrink:0;margin-top:2px;}
.mc-kpi-text{font-size:13px;line-height:1.7;color:rgba(255,255,255,0.75);}
.mc-kpi-text strong{color:#fff;}
.mc-kpi-divider{border:none;border-top:1px solid rgba(255,255,255,0.1);margin:18px 0;}
.mc-kpi-analysis{font-size:12px;line-height:1.75;color:rgba(255,255,255,0.6);}
.mc-kpi-analysis strong{color:rgba(255,255,255,0.85);display:block;margin-bottom:4px;}


/* ── CARRUSEL MERCADEO ── */
.mc-carousel{
  position:absolute;
  top:0;
  bottom:0;
  left:80px;
  right:0;
  overflow:hidden;
}
.mc-slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity .8s ease;
  pointer-events:none;
}
.mc-slide.active{
  opacity:1;
  pointer-events:all;
}
.mc-slide img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  display:block;
}
/* Indicadores */
.mc-indicators{
  position:absolute;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  z-index:10;
}
.mc-ind{
  width:8px;height:8px;
  border-radius:50%;
  background:rgba(255,255,255,0.25);
  transition:background .3s, transform .3s;
  cursor:pointer;
}
.mc-ind.active{
  background:var(--orange);
  transform:scale(1.3);
}
/* Flechas sutiles */
.mc-arrow{
  position:absolute;
  top:50%;transform:translateY(-50%);
  width:44px;height:44px;
  border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;
  transition:background .2s;
  font-size:18px;color:rgba(255,255,255,0.7);
  user-select:none;
}
.mc-arrow:hover{background:rgba(240,90,0,0.3);}
.mc-arrow.prev{left:16px;}
.mc-arrow.next{right:16px;}
/* Contador */
.mc-counter{
  position:absolute;
  top:16px;right:20px;
  font-size:12px;
  color:rgba(255,255,255,0.35);
  letter-spacing:.1em;
  z-index:10;
}

/* OVERLAY */
#ov{position:fixed;inset:0;background:var(--navy3);z-index:200;pointer-events:none;opacity:0;transition:opacity .3s var(--ease);}
#ov.on{opacity:.45;}
</style>
</head>
<body>
<div id="cur"></div>
<div id="cur2"></div>
<div id="ov"></div>

<div id="shell">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="logo-mark" onclick="goTo(0)">L</div>
  </div>

  <!-- MAIN -->
  <div id="main">

    <!-- HOME -->
    <div id="stage-home">
      <div class="dots-bg" id="dotsBg"></div>
      <div id="home-content">
        <div class="home-logo"><span class="live">Live</span><span class="link">Link</span></div>
        <div class="home-rule"></div>
        <div class="home-sub">Propuesta Campaña de Reconocimiento</div>
      </div>
    </div>

    <!-- COL 1 -->
    <div class="nav-col" id="nc1" onclick="handleClick(1)">
      <div class="nav-num-wrap"><div class="nav-num-inner">1</div></div>
      <div class="nav-label">En Mercadeo</div>
      <div class="col-content" id="content-1">
        <div class="mc-carousel" id="mc-carousel">
          <div class="mc-slide active" data-index="0">
            <img src="https://raguerreos-cmd.github.io/livelink-presentacion/mercadeo/Mercadeo-1.png" alt="Mercadeo 1" loading="lazy">
          </div>
          <div class="mc-slide" data-index="1">
            <img src="https://raguerreos-cmd.github.io/livelink-presentacion/mercadeo/Mercadeo-2.png" alt="Mercadeo 2" loading="lazy">
          </div>
          <div class="mc-slide" data-index="2">
            <img src="https://raguerreos-cmd.github.io/livelink-presentacion/mercadeo/Mercadeo-3.png" alt="Mercadeo 3" loading="lazy">
          </div>
          <div class="mc-slide" data-index="3">
            <img src="https://raguerreos-cmd.github.io/livelink-presentacion/mercadeo/Mercadeo-4.png" alt="Mercadeo 4" loading="lazy">
          </div>
          <div class="mc-slide" data-index="4">
            <img src="https://raguerreos-cmd.github.io/livelink-presentacion/mercadeo/Mercadeo-5.png" alt="Mercadeo 5" loading="lazy">
          </div>
          <div class="mc-slide" data-index="5">
            <img src="https://raguerreos-cmd.github.io/livelink-presentacion/mercadeo/Mercadeo-6.png" alt="Mercadeo 6" loading="lazy">
          </div>
          <div class="mc-slide" data-index="6">
            <img src="https://raguerreos-cmd.github.io/livelink-presentacion/mercadeo/Mercadeo-7.png" alt="Mercadeo 7" loading="lazy">
          </div>
          <div class="mc-slide" data-index="7">
            <img src="https://raguerreos-cmd.github.io/livelink-presentacion/mercadeo/Mercadeo-8.png" alt="Mercadeo 8" loading="lazy">
          </div>
          <div class="mc-slide" data-index="8">
            <img src="https://raguerreos-cmd.github.io/livelink-presentacion/mercadeo/Mercadeo-9.png" alt="Mercadeo 9" loading="lazy">
          </div>
          <div class="mc-slide" data-index="9">
            <img src="https://raguerreos-cmd.github.io/livelink-presentacion/mercadeo/Mercadeo-10.png" alt="Mercadeo 10" loading="lazy">
          </div>

          <!-- Indicadores -->
          <div class="mc-indicators">
          <div class="mc-ind active" onclick="mcGoTo(0)"></div>
          <div class="mc-ind" onclick="mcGoTo(1)"></div>
          <div class="mc-ind" onclick="mcGoTo(2)"></div>
          <div class="mc-ind" onclick="mcGoTo(3)"></div>
          <div class="mc-ind" onclick="mcGoTo(4)"></div>
          <div class="mc-ind" onclick="mcGoTo(5)"></div>
          <div class="mc-ind" onclick="mcGoTo(6)"></div>
          <div class="mc-ind" onclick="mcGoTo(7)"></div>

<script>
// CURSOR
const cur=document.getElementById('cur'),cur2=document.getElementById('cur2');
let mx=0,my=0,cx=0,cy=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';});
(function a(){cx+=(mx-cx)*.11;cy+=(my-cy)*.11;cur2.style.left=cx+'px';cur2.style.top=cy+'px';requestAnimationFrame(a);})();

// DOTS
const DOTS_HOME=[
  [18,4,28,'o'],[28,2,20,'d'],[38,0,36,'o'],[48,3,18,'d'],
  [55,4,50,'o'],[62,1,16,'d'],[9,18,18,'d'],[40,9,14,'d'],
  [63,5,22,'d'],[68,2,20,'d'],[6,82,20,'d'],[10,89,42,'o'],
  [20,91,18,'d'],[29,86,34,'o'],[41,88,16,'d'],[51,93,16,'d'],
  [60,85,12,'d'],[75,87,10,'d'],[50,68,10,'d'],
];
const bg=document.getElementById('dotsBg');
let dotEls=[];
function spawnDots(){
  dotEls.forEach(d=>{d.classList.remove('show');setTimeout(()=>d.remove(),700);});
  dotEls=[];
  DOTS_HOME.forEach(([x,y,s,t],i)=>{
    const el=document.createElement('div');
    el.className=`dot dot-${t}`;
    el.style.cssText=`left:${x}%;top:${y}%;width:${s}px;height:${s}px;transition-delay:${i*55}ms`;
    bg.appendChild(el);dotEls.push(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  });
}
spawnDots();

// NAV
const main=document.getElementById('main');
const cols=[null,
  document.getElementById('nc1'),
  document.getElementById('nc2'),
  document.getElementById('nc3'),
  document.getElementById('nc4'),
];
const ov=document.getElementById('ov');
let cur_p=0;

function handleClick(idx){
  if(cur_p===idx) return; // ya activa, no hacer nada
  goTo(idx);
}

function goTo(idx){
  if(idx===cur_p) return;
  ov.classList.add('on');
  setTimeout(()=>ov.classList.remove('on'),280);
  if(cur_p>0) cols[cur_p].classList.remove('active');
  if(idx===0){
    main.classList.remove('panel-open');
    dotEls.forEach(d=>d.classList.remove('show'));
    setTimeout(()=>spawnDots(),180);
  } else {
    main.classList.add('panel-open');
    cols[idx].classList.add('active');
    if(idx === 4) loadDID();
    if(idx === 1) setTimeout(mcInitWheel, 400);
  }
  cur_p=idx;
}

document.getElementById('logo-mark').addEventListener('click',()=>goTo(0));

// ── D-ID: cargar dinámicamente solo cuando se abre col 4 ──
let didLoaded = false;
function loadDID() {
  if (didLoaded) return;
  didLoaded = true;
  const s = document.createElement('script');
  s.type = 'module';
  s.src = 'https://agent.d-id.com/v2/index.js';
  s.setAttribute('data-mode', 'full');
  s.setAttribute('data-client-key', 'ck_7VK-RuXdoFk1ks2ao2VH8');
  s.setAttribute('data-agent-id', 'v2_agt_CsdsDcif');
  s.setAttribute('data-name', 'did-agent');
  s.setAttribute('data-monitor', 'true');
  s.setAttribute('data-target-id', 'did-host');
  document.body.appendChild(s);
}

// ── CARRUSEL MERCADEO ──
const MC_TOTAL = 10;
let mcCurrent = 0;
let mcWheelLock = false;

function mcGoTo(idx) {
  const slides = document.querySelectorAll('.mc-slide');
  const inds   = document.querySelectorAll('.mc-ind');
  slides[mcCurrent].classList.remove('active');
  inds[mcCurrent].classList.remove('active');
  mcCurrent = (idx + MC_TOTAL) % MC_TOTAL;
  slides[mcCurrent].classList.add('active');
  inds[mcCurrent].classList.add('active');
}
function mcNext() { mcGoTo(mcCurrent + 1); }
function mcPrev() { mcGoTo(mcCurrent - 1); }

function mcInitWheel() {
  const el = document.getElementById('mc-carousel');
  if (!el || el._wheelBound) return;
  el._wheelBound = true;
  el.addEventListener('wheel', e => {
    e.preventDefault();
    e.stopPropagation();
    if (mcWheelLock) return;
    mcWheelLock = true;
    if (e.deltaY > 0 || e.deltaX > 0) mcNext();
    else mcPrev();
    setTimeout(() => mcWheelLock = false, 900);
  }, { passive: false });
}

// Capturar scroll global cuando col 1 está activa
window.addEventListener('wheel', e => {
  if (cur_p !== 1) return;
  e.preventDefault();
  e.stopPropagation();
  if (mcWheelLock) return;
  mcWheelLock = true;
  if (e.deltaY > 0 || e.deltaX > 0) mcNext();
  else mcPrev();
  setTimeout(() => mcWheelLock = false, 900);
}, { passive: false });


// ── CARRUSEL DISEÑO PUBLICITARIO ──
const DP_TOTAL = 9;
let dpCurrent = 0;
let dpWheelLock = false;

function dp_goTo(idx) {
  const slides = document.querySelectorAll('#dp-carousel .mc-slide');
  const inds   = document.querySelectorAll('#dp-carousel .mc-ind');
  slides[dpCurrent].classList.remove('active');
  inds[dpCurrent].classList.remove('active');
  dpCurrent = (idx + DP_TOTAL) % DP_TOTAL;
  slides[dpCurrent].classList.add('active');
  inds[dpCurrent].classList.add('active');
}
function dp_next() { dp_goTo(dpCurrent + 1); }
function dp_prev() { dp_goTo(dpCurrent - 1); }

window.addEventListener('wheel', e => {
  if (cur_p !== 2) return;
  e.preventDefault();
  e.stopPropagation();
  if (dpWheelLock) return;
  dpWheelLock = true;
  if (e.deltaY > 0 || e.deltaX > 0) dp_next();
  else dp_prev();
  setTimeout(() => dpWheelLock = false, 900);
}, { passive: false });


// ── CARRUSEL ANIMACIÓN & AUDIOVISUALES ──
const AV_TOTAL = 2;
let avCurrent = 0;
let avWheelLock = false;

function av_goTo(idx) {
  const slides = document.querySelectorAll('#av-carousel .mc-slide');
  const inds   = document.querySelectorAll('#av-carousel .mc-ind');
  slides[avCurrent].classList.remove('active');
  inds[avCurrent].classList.remove('active');
  avCurrent = (idx + AV_TOTAL) % AV_TOTAL;
  slides[avCurrent].classList.add('active');
  inds[avCurrent].classList.add('active');
}
function av_next() { av_goTo(avCurrent + 1); }
function av_prev() { av_goTo(avCurrent - 1); }

window.addEventListener('wheel', e => {
  if (cur_p !== 3) return;
  e.preventDefault();
  e.stopPropagation();
  if (avWheelLock) return;
  avWheelLock = true;
  if (e.deltaY > 0 || e.deltaX > 0) av_next();
  else av_prev();
  setTimeout(() => avWheelLock = false, 900);
}, { passive: false });

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') goTo(0);
  if(e.key==='ArrowRight') goTo(Math.min(cur_p===0?1:cur_p+1,4));
  if(e.key==='ArrowLeft'){ if(cur_p>1) goTo(cur_p-1); else goTo(0); }
});
</script>
